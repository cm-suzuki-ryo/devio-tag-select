AWSTemplateFormatVersion: '2010-09-09'
Description: 'Unified Tag Selector with Step Functions - All in One Template'

Parameters:
  ContentfulSpaceId:
    Type: String
    Description: 'Contentful Space ID'
    Default: 'your-space-id'
  ContentfulAccessToken:
    Type: String
    Description: 'Contentful Access Token'
    Default: 'your-access-token'
    NoEcho: true

Resources:
  # IAM Role for Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:tag-selector-*'
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: '*'
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartSyncExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:tag-selector-unified'
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:tag-selector-*'

  # CloudWatch Log Group for Step Functions
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/${AWS::StackName}-tag-selector'
      RetentionInDays: 14

  # Step Functions State Machine
  TagSelectorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: tag-selector-unified
      StateMachineType: EXPRESS
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "SetCostParameters",
          "States": {
            "SetCostParameters": {
              "Type": "Pass",
              "Parameters": {
                "input_price_per_million": 0.25,
                "output_price_per_million": 1.25,
                "usd_to_jpy": 150
              },
              "ResultPath": "$.cost_params",
              "Next": "GetArticle"
            },
            "GetArticle": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ContentfulGetterFunction}",
                "Payload": {"slug.$": "$.slug", "model_id.$": "$.model_id"}
              },
              "ResultPath": "$.article",
              "Next": "GetTags"
            },
            "GetTags": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {"FunctionName": "${TagsFunction}", "Payload": {}},
              "ResultPath": "$.tags",
              "Next": "CheckTextLength"
            },
            "CheckTextLength": {
              "Type": "Choice",
              "Choices": [{
                "Variable": "$.article.Payload.text_length",
                "NumericGreaterThan": 8000,
                "Next": "SummarizeText"
              }],
              "Default": "RecommendTags"
            },
            "SummarizeText": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${SummaryFunction}",
                "Payload": {"blog_text.$": "$.article.Payload.blog_text", "model_id.$": "$.model_id"}
              },
              "ResultPath": "$.summary",
              "Next": "RecommendTags"
            },
            "RecommendTags": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "TagRecommendation",
                  "States": {
                    "TagRecommendation": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${RecommendationFunction}",
                        "Payload.$": "$"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "SnippetGeneration", 
                  "States": {
                    "SnippetGeneration": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${SnippetGeneratorFunction}",
                        "Payload": {
                          "title.$": "$.article.Payload.title",
                          "content.$": "$.article.Payload.content",
                          "model_id.$": "$.model_id"
                        }
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "ArticleReview",
                  "States": {
                    "ArticleReview": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${ArticleReviewFunction}",
                        "Payload": {
                          "title.$": "$.article.Payload.title",
                          "content.$": "$.article.Payload.content",
                          "model_id.$": "$.model_id"
                        }
                      },
                      "End": true
                    }
                  }
                }
              ],
              "ResultPath": "$.parallel_results",
              "Next": "FormatOutput"
            },
            "FormatOutput": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${OutputFormatterFunction}",
                "Payload.$": "$"
              },
              "ResultSelector": {
                "result.$": "$.Payload"
              },
              "End": true
            }
          }
        }

  # Main Lambda Function
  MainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-unified-main
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: !Sub |
          import json
          import boto3
          import os
          import uuid

          def lambda_handler(event, context):
              try:
                  if event.get('httpMethod'):
                      params = event.get('queryStringParameters') or {} if event['httpMethod'] == 'GET' else json.loads(event.get('body', '{}'))
                  else:
                      params = event

                  slug = params.get('slug')
                  model_id = params.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')

                  if not slug:
                      return {'statusCode': 400, 'body': json.dumps({'error': 'slug required'})}

                  stepfunctions = boto3.client('stepfunctions')
                  response = stepfunctions.start_sync_execution(
                      stateMachineArn='${TagSelectorStateMachine}',
                      name=f"tag-selector-{uuid.uuid4().hex[:8]}",
                      input=json.dumps({'slug': slug, 'model_id': model_id})
                  )

                  if response['status'] == 'SUCCEEDED':
                      result = json.loads(response['output'])
                      return {'statusCode': 200, 'headers': {'Content-Type': 'application/json'}, 'body': json.dumps(result['result'])}
                  else:
                      return {'statusCode': 500, 'body': json.dumps({'error': 'Step Functions failed'})}

              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}

  # Contentful Getter Function
  ContentfulGetterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-contentful
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.parse
          import os

          def lambda_handler(event, context):
              try:
                  slug = event['slug']
                  space_id = os.environ['CONTENTFUL_SPACE_ID']
                  access_token = os.environ['CONTENTFUL_ACCESS_TOKEN']
                  
                  params = {
                      'access_token': access_token,
                      'content_type': 'blogPost',
                      'fields.slug': slug,
                      'limit': '1'
                  }
                  
                  url = f"https://cdn.contentful.com/spaces/{space_id}/entries?" + urllib.parse.urlencode(params)
                  
                  with urllib.request.urlopen(url) as response:
                      data = json.loads(response.read().decode())
                  
                  if not data['items']:
                      raise Exception(f"Article not found: {slug}")
                  
                  item = data['items'][0]['fields']
                  title = item.get('title', '')
                  content = item.get('content', '')
                  blog_text = f"{title}\n\n{content}"
                  
                  return {
                      'title': title,
                      'content': content, 
                      'blog_text': blog_text,
                      'text_length': len(blog_text)
                  }
              except Exception as e:
                  raise Exception(f"Failed to get article: {str(e)}")

  # Summary Function
  SummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-summary
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          def lambda_handler(event, context):
              try:
                  blog_text = event['blog_text']
                  model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                  
                  bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
                  
                  prompt = f"以下のブログ記事を1000文字程度で要約してください。技術的なキーワードや重要な概念は必ず含めてください：\n\n{blog_text}"
                  
                  if 'nova' in model_id.lower():
                      body = {
                          "messages": [{"role": "user", "content": [{"text": prompt}]}],
                          "inferenceConfig": {"temperature": 0.1}
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      summary_text = response_body['output']['message']['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['inputTokens'],
                          'output_tokens': response_body['usage']['outputTokens']
                      }
                  else:
                      # Claude fallback
                      body = {
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 8192,
                          "system": [{"type": "text", "text": "あなたは記事要約の専門家です。"}],
                          "messages": [{"role": "user", "content": prompt}]
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      summary_text = response_body['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['input_tokens'],
                          'output_tokens': response_body['usage']['output_tokens']
                      }
                  
                  return {'summary_text': summary_text, 'cache_info': cache_info}
              except Exception as e:
                  raise Exception(f"Summary failed: {str(e)}")

  # Tags Function
  TagsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-tags
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.parse
          import os

          def lambda_handler(event, context):
              try:
                  space_id = os.environ['CONTENTFUL_SPACE_ID']
                  access_token = os.environ['CONTENTFUL_ACCESS_TOKEN']
                  
                  params = {
                      'access_token': access_token,
                      'content_type': 'blogTags',
                      'limit': '1000'
                  }
                  
                  url = f"https://cdn.contentful.com/spaces/{space_id}/entries?" + urllib.parse.urlencode(params)
                  
                  with urllib.request.urlopen(url) as response:
                      data = json.loads(response.read().decode())
                  
                  tags_data = []
                  for item in data['items']:
                      fields = item['fields']
                      tags_data.append({
                          'name': fields.get('name', ''),
                          'description': fields.get('description', ''),
                          'category': fields.get('category', '')
                      })
                  
                  return {'tags_data': tags_data}
              except Exception as e:
                  raise Exception(f"Failed to get tags: {str(e)}")

  # Recommendation Function
  RecommendationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-recommendation
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import re

          def lambda_handler(event, context):
              try:
                  # Step Functions形式の入力を処理
                  if 'article' in event and 'tags' in event:
                      # Step Functions経由
                      article_data = event['article']['Payload']
                      tags_data = event['tags']['Payload']['tags_data']
                      model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                      
                      # 要約があるかチェック
                      if 'summary' in event and event['summary'].get('Payload'):
                          text = event['summary']['Payload']['summary_text']
                      else:
                          text = article_data['blog_text']
                  else:
                      # 直接呼び出し
                      text = event.get('text') or event.get('fallback_text')
                      tags_data = event['tags_data']
                      model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                  
                  # Simple tag filtering
                  filtered_tags = []
                  text_lower = text.lower()
                  for tag in tags_data:
                      tag_name = tag['name'].lower()
                      if any(keyword in text_lower for keyword in tag_name.split()):
                          filtered_tags.append(tag)
                  
                  if len(filtered_tags) > 20:
                      filtered_tags = filtered_tags[:20]
                  
                  bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
                  
                  tag_list = "\n".join([f"- {tag['name']}: {tag.get('description', '')}" for tag in filtered_tags])
                  prompt = f"以下の記事に最適なタグを5個選んでください:\n\n記事内容:\n{text[:2000]}\n\n利用可能なタグ:\n{tag_list}\n\nJSON形式で回答してください:\n{{\"selected_tags\": [\"タグ1\", \"タグ2\", \"タグ3\", \"タグ4\", \"タグ5\"]}}"
                  
                  if 'nova' in model_id.lower():
                      body = {
                          "messages": [{"role": "user", "content": [{"text": prompt}]}],
                          "inferenceConfig": {"temperature": 0.1}
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      result_text = response_body['output']['message']['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['inputTokens'],
                          'output_tokens': response_body['usage']['outputTokens']
                      }
                  else:
                      # Claude fallback
                      body = {
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 8000,
                          "messages": [{"role": "user", "content": prompt}]
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      result_text = response_body['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['input_tokens'],
                          'output_tokens': response_body['usage']['output_tokens']
                      }
                  
                  # Extract JSON
                  json_match = re.search(r'\{[^}]*"selected_tags"[^}]*\}', result_text)
                  if json_match:
                      selected_data = json.loads(json_match.group())
                      selected_tags = selected_data.get('selected_tags', [])
                  else:
                      selected_tags = [tag['name'] for tag in filtered_tags[:5]]
                  
                  return {
                      'selected_tags': selected_tags,
                      'cache_info': cache_info
                  }
              except Exception as e:
                  raise Exception(f"Recommendation failed: {str(e)}")

  # Final Output Formatter Function
  OutputFormatterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-output-formatter
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              try:
                  # 並列実行結果を取得
                  parallel_results = event.get('parallel_results', [])
                  tag_result = parallel_results[0]['Payload'] if len(parallel_results) > 0 else {}
                  snippet_result = parallel_results[1]['Payload'] if len(parallel_results) > 1 else {}
                  review_result = parallel_results[2]['Payload'] if len(parallel_results) > 2 else {}
                  
                  # 記事データを取得
                  article_data = event.get('article', {}).get('Payload', {})
                  summary_data = event.get('summary', {}).get('Payload', {})
                  
                  # 要約文章を決定（要約があれば要約、なければ記事の最初の200文字）
                  if summary_data and summary_data.get('summary_text'):
                      summary_text = summary_data['summary_text']
                  else:
                      blog_text = article_data.get('blog_text', '')
                      summary_text = blog_text[:200] + "..." if len(blog_text) > 200 else blog_text
                  
                  # コスト情報を詳細に分解
                  summary_cost = summary_data.get('cache_info', {}) if summary_data else {}
                  tag_cost = tag_result.get('cache_info', {})
                  snippet_cost = snippet_result.get('cache_info', {})
                  review_cost = review_result.get('cache_info', {})
                  
                  # 合算コスト計算
                  total_input_tokens = (
                      summary_cost.get('input_tokens', 0) + 
                      tag_cost.get('input_tokens', 0) + 
                      snippet_cost.get('input_tokens', 0) +
                      review_cost.get('input_tokens', 0)
                  )
                  total_output_tokens = (
                      summary_cost.get('output_tokens', 0) + 
                      tag_cost.get('output_tokens', 0) + 
                      snippet_cost.get('output_tokens', 0) +
                      review_cost.get('output_tokens', 0)
                  )
                  
                  # 価格設定（Step Functionsから取得）
                  cost_params = event.get('cost_params', {})
                  input_price = cost_params.get('input_price_per_million', 0.25)
                  output_price = cost_params.get('output_price_per_million', 1.25)
                  usd_to_jpy = cost_params.get('usd_to_jpy', 150)
                  
                  def calculate_tokens_only(input_tokens, output_tokens):
                      return {
                          'input_tokens': input_tokens,
                          'output_tokens': output_tokens
                      }
                  
                  def calculate_cost_only(input_tokens, output_tokens):
                      input_cost = (input_tokens / 1000000) * input_price * usd_to_jpy
                      output_cost = (output_tokens / 1000000) * output_price * usd_to_jpy
                      return {
                          'input_tokens': input_tokens,
                          'output_tokens': output_tokens,
                          'input_cost_jpy': round(input_cost, 4),
                          'output_cost_jpy': round(output_cost, 4),
                          'total_cost_jpy': round(input_cost + output_cost, 4)
                      }
                  
                  # 各処理のトークン数のみ
                  summary_tokens = calculate_tokens_only(
                      summary_cost.get('input_tokens', 0),
                      summary_cost.get('output_tokens', 0)
                  ) if summary_data else None
                  
                  tag_tokens = calculate_tokens_only(
                      tag_cost.get('input_tokens', 0),
                      tag_cost.get('output_tokens', 0)
                  )
                  
                  snippet_tokens = calculate_tokens_only(
                      snippet_cost.get('input_tokens', 0),
                      snippet_cost.get('output_tokens', 0)
                  )
                  
                  review_tokens = calculate_tokens_only(
                      review_cost.get('input_tokens', 0),
                      review_cost.get('output_tokens', 0)
                  )
                  
                  # 合算コスト（JPY表示）
                  total_cost_info = calculate_cost_only(total_input_tokens, total_output_tokens)
                  
                  # 最終出力を構築
                  result = {
                      'title': article_data.get('title', ''),
                      'summary': summary_text,
                      'snippet': snippet_result.get('snippet', ''),
                      'selected_tags': tag_result.get('selected_tags', []),
                      'review_feedback': review_result.get('review_feedback', ''),
                      'cost_breakdown': {
                          'summary': summary_tokens,
                          'tag_recommendation': tag_tokens,
                          'snippet_generation': snippet_tokens,
                          'article_review': review_tokens,
                          'total': total_cost_info
                      }
                  }
                  
                  return result
                  
              except Exception as e:
                  return {
                      'error': f"Output formatting failed: {str(e)}",
                      'title': '',
                      'summary': '',
                      'snippet': '',
                      'selected_tags': [],
                      'review_feedback': '',
                      'cost_breakdown': {
                          'summary': None,
                          'tag_recommendation': {'input_tokens': 0, 'output_tokens': 0},
                          'snippet_generation': {'input_tokens': 0, 'output_tokens': 0},
                          'article_review': {'input_tokens': 0, 'output_tokens': 0},
                          'total': {'input_tokens': 0, 'output_tokens': 0, 'input_cost_jpy': 0, 'output_cost_jpy': 0, 'total_cost_jpy': 0}
                      }
                  }

  # HTML Formatter Function (独立)
  HtmlFormatterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-html-formatter
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            try {
              let data;
              
              // HTTP リクエストの場合
              if (event.httpMethod) {
                if (event.httpMethod === 'POST' && event.body) {
                  data = JSON.parse(event.body);
                } else if (event.httpMethod === 'GET' && event.queryStringParameters?.data) {
                  data = JSON.parse(decodeURIComponent(event.queryStringParameters.data));
                } else {
                  return {
                    statusCode: 400,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ error: 'JSON data required in body (POST) or data parameter (GET)' })
                  };
                }
              } else {
                // 直接呼び出しの場合
                data = event;
              }
              
              const html = generateHTML(data);
              
              return {
                statusCode: 200,
                headers: { 'Content-Type': 'text/html; charset=utf-8' },
                body: html
              };
            } catch (error) {
              return {
                statusCode: 500,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ error: error.message })
              };
            }
          };
          
          function generateHTML(data) {
            const { title, summary, snippet, selected_tags, review_feedback, cost_breakdown } = data;
            
            return `<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${title || 'タグ選択結果'}</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 40px; line-height: 1.6; color: #333; }
              .container { max-width: 800px; margin: 0 auto; }
              .header { text-align: center; margin-bottom: 40px; }
              .section { margin: 30px 0; padding: 20px; border-left: 4px solid #007acc; background: #f8f9fa; border-radius: 0 8px 8px 0; }
              .section h2 { margin-top: 0; color: #007acc; }
              .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
              .tag { background: #007acc; color: white; padding: 6px 12px; border-radius: 16px; font-size: 14px; }
