                  <div class="cost-item"><strong>合計コスト:</strong> ${cost_breakdown?.total?.total_cost_jpy || 0} JPY</div>
                  <div class="cost-item"><strong>入力トークン:</strong> ${cost_breakdown?.total?.input_tokens || 0}</div>
                  <div class="cost-item"><strong>出力トークン:</strong> ${cost_breakdown?.total?.output_tokens || 0}</div>
                  <hr style="margin: 10px 0;">
                  <div class="cost-item">タグ推薦: ${cost_breakdown?.tag_recommendation?.input_tokens || 0} + ${cost_breakdown?.tag_recommendation?.output_tokens || 0}</div>
                  <div class="cost-item">スニペット: ${cost_breakdown?.snippet_generation?.input_tokens || 0} + ${cost_breakdown?.snippet_generation?.output_tokens || 0}</div>
                  <div class="cost-item">記事レビュー: ${cost_breakdown?.article_review?.input_tokens || 0} + ${cost_breakdown?.article_review?.output_tokens || 0}</div>
                </div>
