  # Snippet Generator Function
  SnippetGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-snippet-generator-${AWS::StackName}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import re
          import collections

          def lambda_handler(event, context):
              try:
                  title = event.get('title', '')
                  content = event.get('content', '')
                  model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                  
                  if not title and not content:
                      raise ValueError("title or content is required")
                  
                  full_text = f"{title}\n\n{content}" if title and content else (title or content)
                  snippet_text, cache_info = generate_snippet_with_ai(full_text, model_id, title)
                  
                  return {
                      'snippet': snippet_text,
                      'cache_info': cache_info,
                      'model_id': model_id
                  }
              except Exception as e:
                  raise Exception(f"Snippet generation failed: {str(e)}")

          def extract_keywords(text, title=""):
              combined_text = f"{title} {text}"
              tech_terms = re.findall(r'[A-Z][a-zA-Z]+|[ぁ-んァ-ヶー一-龯]{2,8}', combined_text)
              english_words = re.findall(r'[A-Za-z]{3,}', combined_text)
              japanese_words = re.findall(r'[ぁ-んァ-ヶー一-龯]{2,6}', combined_text)
              
              all_keywords = tech_terms + english_words + japanese_words
              stop_words = {
                  'です', 'ます', 'した', 'する', 'ある', 'いる', 'なる', 'この', 'その',
                  'から', 'まで', 'より', 'ため', 'について', 'として', 'による', 'こと',
                  'the', 'and', 'for', 'are', 'but', 'not', 'you', 'all', 'can', 'had'
              }
              
              filtered_keywords = [kw.lower() for kw in all_keywords if len(kw) > 1 and kw.lower() not in stop_words]
              keyword_counts = collections.Counter(filtered_keywords)
              
              unique_keywords = []
              for keyword, count in keyword_counts.most_common(20):
                  if keyword not in unique_keywords:
                      unique_keywords.append(keyword)
              return unique_keywords[:8]

          def extract_conclusion_content(text):
              conclusion_patterns = [
                  r'##\s*まとめ[\s\S]*?(?=\n##|\n#|$)',
                  r'##\s*最後に[\s\S]*?(?=\n##|\n#|$)', 
                  r'まとめ\n\n[\s\S]*?(?=\n\n[^\n]|\n##|$)',
              ]
              
              conclusion_text = ""
              for pattern in conclusion_patterns:
                  matches = re.findall(pattern, text, re.IGNORECASE)
                  if matches:
                      conclusion_text = matches[-1].strip()
                      break
              
              if not conclusion_text:
                  paragraphs = [p.strip() for p in text.split('\n\n') if p.strip()]
                  if len(paragraphs) > 2:
                      conclusion_text = paragraphs[-1]
              return conclusion_text

          def format_two_sentence_snippet(text):
              # テキストをクリーンアップ
              cleaned_text = text.strip()
              
              # Markdown見出しを除去
              cleaned_text = re.sub(r'^#+\s*[^\n]*\n*', '', cleaned_text, flags=re.MULTILINE)
              cleaned_text = re.sub(r'\n#+\s*[^\n]*\n*', '\n', cleaned_text, flags=re.MULTILINE)
              
              # プロンプト形式の出力を処理
              cleaned_text = re.sub(r'^第[12]文[（(][^）)]*[）)][：:]?\s*', '', cleaned_text)
              cleaned_text = re.sub(r'\n第[12]文[（(][^）)]*[）)][：:]?\s*', '', cleaned_text)
              
              # 160文字前後に調整（柔軟に）
              if len(cleaned_text) > 180:
                  # 文の境界で切り詰め
                  sentences = re.split(r'[。！？]', cleaned_text)
                  result = ""
                  for sentence in sentences:
                      if sentence.strip():
                          test_result = result + sentence.strip() + "。"
                          if len(test_result) <= 170:
                              result = test_result
                          else:
                              break
                  
                  if result:
                      return result
                  else:
                      # 単純に切り詰め
                      return cleaned_text[:157] + "..."
              
              # 文末処理
              if cleaned_text and not cleaned_text.endswith(('。', '！', '？', '.')):
                  cleaned_text += "。"
              
              return cleaned_text

          def generate_snippet_with_ai(text, model_id, title=""):
              bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
              
              keywords = extract_keywords(text, title)
              keywords_text = "、".join(keywords[:8])
              conclusion = extract_conclusion_content(text)
              
              prompt_parts = [
                  f"タイトル: {title}",
                  "",
                  "要件:",
                  "- 160文字前後を目安（必須ではない）",
                  "- 文数は自由（1文でも複数文でも可）",
                  "",
                  "優先順位:",
                  "1. タイトルとの連続性・補足説明を最優先",
                  "2. 記事のまとめ・結論内容を反映", 
                  "3. 重要なキーワードを自然に含める",
                  "4. SEO効果と検索結果での理解促進",
                  "",
                  f"- 主要キーワード: {keywords_text}",
                  "- 検索ユーザーが記事内容を適切に理解できる説明",
                  "- タイトルで言及されていない価値・詳細を補完",
                  ""
              ]
              
              if conclusion:
                  prompt_parts.extend([
                      "記事の結論・まとめ:",
                      conclusion[:500],
                      "",
                      "記事全体:",
                      text[:1500]
                  ])
              else:
                  prompt_parts.extend([
                      "記事内容:",
                      text[:2000]
                  ])
              
              prompt_parts.extend([
                  "",
                  "タイトルを補完し、記事内容の理解を促進するスニペット:"
              ])
              prompt = "\n".join(prompt_parts)
              
              if 'nova' in model_id.lower():
                  body = {
                      "messages": [{"role": "user", "content": [{"text": prompt}]}],
                      "inferenceConfig": {"temperature": 0.3, "maxTokens": 300}
                  }
                  response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                  response_body = json.loads(response['body'].read())
                  
                  snippet_text = response_body['output']['message']['content'][0]['text'].strip()
                  cache_info = {
                      'input_tokens': response_body['usage']['inputTokens'],
                      'output_tokens': response_body['usage']['outputTokens']
                  }
              else:
                  body = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "max_tokens": 300,
                      "temperature": 0.3,
                      "messages": [{"role": "user", "content": prompt}]
                  }
                  response = bedrock.invoke_model(
                      modelId=model_id, 
                      body=json.dumps(body)
                  )
                  response_body = json.loads(response['body'].read())
                  
                  snippet_text = response_body['content'][0]['text'].strip()
                  cache_info = {
                      'input_tokens': response_body['usage']['input_tokens'],
                      'output_tokens': response_body['usage']['output_tokens']
                  }
              
              snippet_text = format_two_sentence_snippet(snippet_text)
              return snippet_text, cache_info

  # HTML Formatter Function URL (Protected by CloudFront)
  HtmlFormatterFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HtmlFormatterFunction.Arn
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowMethods: [GET, POST]
        AllowOrigins: ["*"]

  # Custom Cache Policy for Query Parameters
  HtmlFormatterCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'HtmlFormatterCachePolicy-${AWS::StackName}'
        Comment: 'Cache policy that includes query parameters for HTML Formatter'
        DefaultTTL: 300
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: all
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  # Custom Origin Request Policy for Query Parameters
  HtmlFormatterOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub 'HtmlFormatterOriginRequestPolicy-${AWS::StackName}'
        Comment: 'Allow all query parameters and headers for HTML Formatter'
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - User-Agent
            - Referer
        CookiesConfig:
          CookieBehavior: none

  # Origin Access Control for HTML Formatter
  HtmlFormatterOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub 'OAC for HTML Formatter Lambda Function URL - ${AWS::StackName}'
        Name: !Sub 'HtmlFormatterOAC-${AWS::StackName}'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Function for Basic Auth
  BasicAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-basic-auth-function'
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub 'Basic Authentication Function for ${AWS::StackName}'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var headers = request.headers;

          // Expected credentials: ${BasicAuthUser}:${BasicAuthPassword}
          var expectedAuth = "Basic " + btoa("${BasicAuthUser}:${BasicAuthPassword}");

          if (
            typeof headers.authorization === "undefined" ||
            headers.authorization.value !== expectedAuth
          ) {
            return {
              statusCode: 401,
              statusDescription: "Unauthorized",
              headers: { 
                "www-authenticate": { value: "Basic realm=\"Protected Area\"" },
                "content-type": { value: "text/plain" }
              },
              body: "Authentication required"
            };
          }

          return request;
        }

  # CloudFront Distribution for HTML Formatter
  HtmlFormatterCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: BasicAuthFunction
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Protected HTML Formatter with Basic Auth - ${AWS::StackName}'
        Origins:
          - Id: HtmlFormatterOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt HtmlFormatterFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              HTTPPort: 443
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: HtmlFormatterOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref HtmlFormatterCachePolicy
          OriginRequestPolicyId: !Ref HtmlFormatterOriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BasicAuthFunction.FunctionARN

  # Lambda Permission for CloudFront
  HtmlFormatterCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HtmlFormatterFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  HtmlFormatterURL:
    Description: 'HTML Formatter Function URL (Direct - Use CloudFront URL instead)'
    Value: !GetAtt HtmlFormatterFunctionUrl.FunctionUrl
  HtmlFormatterCloudFrontURL:
    Description: 'Protected HTML Formatter URL via CloudFront'
    Value: !Sub 'https://${HtmlFormatterCloudFrontDistribution.DomainName}'
  BasicAuthCredentials:
    Description: 'Basic Auth Credentials for HTML Formatter'
    Value: !Sub '${BasicAuthUser}:${BasicAuthPassword}'
  StepFunctionsArn:
    Description: 'Step Functions State Machine ARN'
    Value: !Ref TagSelectorStateMachine
  StepFunctionsLogGroup:
    Description: 'CloudWatch Log Group for Step Functions execution logs'
    Value: !GetAtt StepFunctionsLogGroup.Arn
