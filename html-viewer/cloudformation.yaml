AWSTemplateFormatVersion: '2010-09-09'
Description: 'Tag Selector HTML Viewer Lambda Function'

Resources:
  HtmlViewerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-html-viewer
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        ZipFile: |
          import { Hono } from 'hono'
          import { handle } from 'hono/aws-lambda'

          const app = new Hono()

          const jsonData = {
            "title": "ACMで発行する証明書のキーアルゴリズムやエクスポートの許可を変更した場合にDNS検証のCNAMEレコードが変わるか確認してみた",
            "summary": "# ブログ記事要約\n\n## AWS Certificate Manager（ACM）のDNS検証レコードに関する検証記事\n\nこのブログ記事は、ACMで発行する証明書のキーアルゴリズムやエクスポート許可を変更した際に、DNS検証用のCNAMEレコードが変わるかを実験的に検証した内容です。",
            "snippet": "AWS ACMの証明書再発行時、DNS検証用CNAMEレコードは変わらない。",
            "selected_tags": ["AWS", "SSL/TLS証明書", "DNS検証", "セキュリティ", "クラウド運用"],
            "review_feedback": "技術的正確性は高く、実験的検証も充実しています。",
            "cost_breakdown": {
              "total": {
                "input_tokens": 22575,
                "output_tokens": 6499,
                "total_cost_jpy": 2.0651
              }
            }
          }

          app.get('/', (c) => {
            const html = `<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${jsonData.title}</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
              .header { border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
              .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
              .tags { display: flex; flex-wrap: wrap; gap: 8px; }
              .tag { background: #007acc; color: white; padding: 4px 12px; border-radius: 16px; font-size: 14px; }
              .cost { background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; }
              pre { background: #f8f8f8; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>${jsonData.title}</h1>
            </div>
            
            <div class="section">
              <h2>📝 記事要約</h2>
              <pre>${jsonData.summary}</pre>
            </div>
            
            <div class="section">
              <h2>✨ SEOスニペット</h2>
              <p><strong>${jsonData.snippet}</strong></p>
            </div>
            
            <div class="section">
              <h2>🏷️ 選択されたタグ</h2>
              <div class="tags">
                ${jsonData.selected_tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
              </div>
            </div>
            
            <div class="section">
              <h2>📋 編集フィードバック</h2>
              <pre>${jsonData.review_feedback}</pre>
            </div>
            
            <div class="section">
              <h2>💰 コスト詳細</h2>
              <div class="cost">
                <div><strong>総コスト:</strong> ¥${jsonData.cost_breakdown.total.total_cost_jpy}</div>
                <div><strong>入力トークン:</strong> ${jsonData.cost_breakdown.total.input_tokens.toLocaleString()}</div>
                <div><strong>出力トークン:</strong> ${jsonData.cost_breakdown.total.output_tokens.toLocaleString()}</div>
              </div>
            </div>
          </body>
          </html>`
            
            return c.html(html)
          })

          export const handler = handle(app)

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HtmlViewerFunction.Arn
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowMethods:
          - GET
        AllowOrigins:
          - "*"

  LambdaFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HtmlViewerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Description: 'Lambda Function URL'
    Value: !GetAtt LambdaFunctionUrl.FunctionUrl
