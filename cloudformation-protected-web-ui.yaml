AWSTemplateFormatVersion: '2010-09-09'
Description: 'Unified Tag Selector with Step Functions - All in One Template'

Parameters:
  ContentfulSpaceId:
    Type: String
    Description: 'Contentful Space ID'
    Default: 'your-space-id'
  ContentfulAccessToken:
    Type: String
    Description: 'Contentful Access Token'
    Default: 'your-access-token'
    NoEcho: true
  ContentfulPreviewToken:
    Type: String
    Description: 'Contentful Preview Token'
    Default: 'your-preview-token'
    NoEcho: true
  BasicAuthUser:
    Type: String
    Default: cm
    Description: Basic Authentication Username
  BasicAuthPassword:
    Type: String
    Default: cm
    NoEcho: true
    Description: Basic Authentication Password
  ModelId:
    Type: String
    Default: 'global.anthropic.claude-haiku-4-5-20251001-v1:0'
    Description: 'AI Model ID to use for processing'
  InputTokenPrice:
    Type: Number
    Default: 0.25
    Description: 'Input token price per million tokens (USD)'
  OutputTokenPrice:
    Type: Number
    Default: 1.25
    Description: 'Output token price per million tokens (USD)'
  UsdToJpy:
    Type: Number
    Default: 150
    Description: 'USD to JPY exchange rate'

Resources:
  # IAM Role for Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:tag-selector-*-${AWS::StackName}'
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: '*'
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartSyncExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:tag-selector-unified-${AWS::StackName}'

  # HTML Formatter Lambda Execution Role (with Step Functions permissions)
  HtmlFormatterLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HtmlFormatterStepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartSyncExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:tag-selector-unified-${AWS::StackName}'

  # CloudWatch Log Group for Step Functions
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/${AWS::StackName}-tag-selector'
      RetentionInDays: 14

  # Step Functions State Machine
  TagSelectorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'tag-selector-unified-${AWS::StackName}'
      StateMachineType: EXPRESS
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "GetArticle",
          "States": {
            "GetArticle": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ContentfulGetterFunction}",
                "Payload.$": "$"
              },
              "ResultPath": "$.article",
              "Next": "GetTags"
            },
            "GetTags": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {"FunctionName": "${TagsFunction}", "Payload": {}},
              "ResultPath": "$.tags",
              "Next": "SummarizeText"
            },
            "SummarizeText": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${SummaryFunction}",
                "Payload": {"blog_text.$": "$.article.Payload.blog_text", "model_id.$": "$.model_id"}
              },
              "ResultPath": "$.summary",
              "Next": "RecommendTags"
            },
            "RecommendTags": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "TagRecommendation",
                  "States": {
                    "TagRecommendation": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${RecommendationFunction}",
                        "Payload.$": "$"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "SnippetGeneration", 
                  "States": {
                    "SnippetGeneration": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${SnippetGeneratorFunction}",
                        "Payload": {
                          "title.$": "$.article.Payload.title",
                          "content.$": "$.article.Payload.content",
                          "model_id.$": "$.model_id"
                        }
                      },
                      "End": true
                    }
                  }
                }
              ],
              "ResultPath": "$.parallel_results",
              "Next": "FormatOutputWithJSONATA"
            },
            "FormatOutputWithJSONATA": {
              "Type": "Pass",
              "Parameters": {
                "title.$": "$.article.Payload.title",
                "summary.$": "$.summary.Payload.summary_text",
                "snippet.$": "$.parallel_results[1].Payload.snippet",
                "selected_tags.$": "$.parallel_results[0].Payload.selected_tags",
                "review_feedback": "",
                "model_id.$": "$.parallel_results[1].Payload.model_id",
                "cost_breakdown": {
                  "summary": {
                    "input_tokens.$": "$.summary.Payload.cache_info.input_tokens",
                    "output_tokens.$": "$.summary.Payload.cache_info.output_tokens"
                  },
                  "tag_recommendation": {
                    "input_tokens.$": "$.parallel_results[0].Payload.cache_info.input_tokens",
                    "output_tokens.$": "$.parallel_results[0].Payload.cache_info.output_tokens"
                  },
                  "snippet_generation": {
                    "input_tokens.$": "$.parallel_results[1].Payload.cache_info.input_tokens",
                    "output_tokens.$": "$.parallel_results[1].Payload.cache_info.output_tokens"
                  },
                  "article_review": {
                    "input_tokens": 0,
                    "output_tokens": 0
                  },
                  "total": {
                    "input_tokens.$": "States.MathAdd(States.MathAdd($.summary.Payload.cache_info.input_tokens, $.parallel_results[0].Payload.cache_info.input_tokens), $.parallel_results[1].Payload.cache_info.input_tokens)",
                    "output_tokens.$": "States.MathAdd(States.MathAdd($.summary.Payload.cache_info.output_tokens, $.parallel_results[0].Payload.cache_info.output_tokens), $.parallel_results[1].Payload.cache_info.output_tokens)"
                  }
                }
              },
              "End": true
            }
          }
        }

  # Contentful Getter Function
  ContentfulGetterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-contentful-${AWS::StackName}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          CONTENTFUL_PREVIEW_TOKEN: !Ref ContentfulPreviewToken
          MODEL_ID: !Ref ModelId
          INPUT_PRICE_PER_MILLION: !Ref InputTokenPrice
          OUTPUT_PRICE_PER_MILLION: !Ref OutputTokenPrice
          USD_TO_JPY: !Ref UsdToJpy
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.parse
          import os

          def lambda_handler(event, context):
              try:
                  slug = event.get('slug')
                  entry_id = event.get('entry_id')
                  use_preview = event.get('use_preview', False)
                  
                  space_id = os.environ['CONTENTFUL_SPACE_ID']
                  
                  if use_preview:
                      access_token = os.environ['CONTENTFUL_PREVIEW_TOKEN']
                      base_url = 'https://preview.contentful.com'
                  else:
                      access_token = os.environ['CONTENTFUL_ACCESS_TOKEN']
                      base_url = 'https://cdn.contentful.com'
                  
                  if entry_id:
                      # Entry ID で直接取得
                      params = {'access_token': access_token}
                      url = f"{base_url}/spaces/{space_id}/entries/{entry_id}?" + urllib.parse.urlencode(params)
                  elif slug:
                      # Slug で検索
                      params = {
                          'access_token': access_token,
                          'content_type': 'blogPost',
                          'fields.slug': slug,
                          'limit': '1'
                      }
                      url = f"{base_url}/spaces/{space_id}/entries?" + urllib.parse.urlencode(params)
                  else:
                      raise ValueError("slug or entry_id is required")
                  
                  with urllib.request.urlopen(url) as response:
                      data = json.loads(response.read().decode())
                  
                  if entry_id:
                      # 直接取得の場合
                      item = data.get('fields', {})
                  else:
                      # 検索の場合
                      if not data.get('items'):
                          raise Exception(f"Article not found: {slug}")
                      item = data['items'][0]['fields']
                  
                  title = item.get('title', '')
                  content = item.get('content', '')
                  blog_text = f"{title}\n\n{content}"
                  
                  return {
                      'title': title,
                      'content': content, 
                      'blog_text': blog_text,
                      'text_length': len(blog_text)
                  }
              except Exception as e:
                  raise Exception(f"Failed to get article: {str(e)}")

  # Summary Function
  SummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-summary-${AWS::StackName}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          def lambda_handler(event, context):
              try:
                  blog_text = event['blog_text']
                  model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                  
                  bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
                  
                  prompt = f"以下のブログ記事を1000文字程度で要約してください。技術的なキーワードや重要な概念は必ず含めてください：\n\n{blog_text}"
                  
                  if 'nova' in model_id.lower():
                      body = {
                          "messages": [{"role": "user", "content": [{"text": prompt}]}],
                          "inferenceConfig": {"temperature": 0.1}
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      summary_text = response_body['output']['message']['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['inputTokens'],
                          'output_tokens': response_body['usage']['outputTokens']
                      }
                  else:
                      # Claude fallback
                      body = {
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 8192,
                          "system": [{"type": "text", "text": "あなたは記事要約の専門家です。"}],
                          "messages": [{"role": "user", "content": prompt}]
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      summary_text = response_body['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['input_tokens'],
                          'output_tokens': response_body['usage']['output_tokens']
                      }
                  
                  return {'summary_text': summary_text, 'cache_info': cache_info}
              except Exception as e:
                  raise Exception(f"Summary failed: {str(e)}")

  # Tags Function
  TagsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-tags-${AWS::StackName}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          MODEL_ID: !Ref ModelId
          INPUT_PRICE_PER_MILLION: !Ref InputTokenPrice
          OUTPUT_PRICE_PER_MILLION: !Ref OutputTokenPrice
          USD_TO_JPY: !Ref UsdToJpy
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.parse
          import os

          def lambda_handler(event, context):
              try:
                  space_id = os.environ['CONTENTFUL_SPACE_ID']
                  access_token = os.environ['CONTENTFUL_ACCESS_TOKEN']
                  
                  params = {
                      'access_token': access_token,
                      'content_type': 'blogTags',
                      'limit': '1000'
                  }
                  
                  url = f"https://cdn.contentful.com/spaces/{space_id}/entries?" + urllib.parse.urlencode(params)
                  
                  with urllib.request.urlopen(url) as response:
                      data = json.loads(response.read().decode())
                  
                  tags_data = []
                  for item in data['items']:
                      fields = item['fields']
                      tags_data.append({
                          'name': fields.get('name', ''),
                          'description': fields.get('description', ''),
                          'category': fields.get('category', '')
                      })
                  
                  return {'tags_data': tags_data}
              except Exception as e:
                  raise Exception(f"Failed to get tags: {str(e)}")

  # Recommendation Function
  RecommendationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-recommendation-${AWS::StackName}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import re

          def lambda_handler(event, context):
              try:
                  # Step Functions形式の入力を処理
                  if 'article' in event and 'tags' in event:
                      # Step Functions経由
                      article_data = event['article']['Payload']
                      tags_data = event['tags']['Payload']['tags_data']
                      model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                      
                      # 要約があるかチェック
                      if 'summary' in event and event['summary'].get('Payload'):
                          text = event['summary']['Payload']['summary_text']
                      else:
                          text = article_data['blog_text']
                  else:
                      # 直接呼び出し
                      text = event.get('text') or event.get('fallback_text')
                      tags_data = event['tags_data']
                      model_id = event.get('model_id', 'global.anthropic.claude-haiku-4-5-20251001-v1:0')
                  
                  # Simple tag filtering
                  filtered_tags = []
                  text_lower = text.lower()
                  for tag in tags_data:
                      tag_name = tag['name'].lower()
                      if any(keyword in text_lower for keyword in tag_name.split()):
                          filtered_tags.append(tag)
                  
                  if len(filtered_tags) > 20:
                      filtered_tags = filtered_tags[:20]
                  
                  bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
                  
                  tag_list = "\n".join([f"- {tag['name']}: {tag.get('description', '')}" for tag in filtered_tags])
                  prompt = f"以下の記事に最適なタグを10個選んでください:\n\n記事内容:\n{text[:2000]}\n\n利用可能なタグ:\n{tag_list}\n\nJSON形式で回答してください。各タグに適合度（1-100、最も適合するものを100）を含め、スコアの高い順に並べてください:\n{{\"selected_tags\": [{{\"name\": \"タグ1\", \"score\": 95}}, {{\"name\": \"タグ2\", \"score\": 88}}]}}"
                  
                  if 'nova' in model_id.lower():
                      body = {
                          "messages": [{"role": "user", "content": [{"text": prompt}]}],
                          "inferenceConfig": {"temperature": 0.1}
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      result_text = response_body['output']['message']['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['inputTokens'],
                          'output_tokens': response_body['usage']['outputTokens']
                      }
                  else:
                      # Claude fallback
                      body = {
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 8000,
                          "messages": [{"role": "user", "content": prompt}]
                      }
                      response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
                      response_body = json.loads(response['body'].read())
                      result_text = response_body['content'][0]['text']
                      cache_info = {
                          'input_tokens': response_body['usage']['input_tokens'],
                          'output_tokens': response_body['usage']['output_tokens']
                      }
                  
                  # Extract JSON - Markdownコードブロックにも対応
                  try:
                      # Markdownコードブロックを除去
                      clean_text = re.sub(r'```[a-z]*\n?', '', result_text)
                      clean_text = re.sub(r'```', '', clean_text)
                      
                      # 完全なJSONブロックを探す
                      json_match = re.search(r'\{.*?"selected_tags".*?\].*?\}', clean_text, re.DOTALL)
                      if json_match:
                          json_text = json_match.group()
                      else:
                          # 部分的なマッチを試す
                          json_match = re.search(r'"selected_tags":\s*\[.*?\]', clean_text, re.DOTALL)
                          if json_match:
                              json_text = '{' + json_match.group() + '}'
                          else:
                              raise ValueError("No JSON found")
                      
                      print(f"Extracted JSON: {json_text}")
                      selected_data = json.loads(json_text)
                      selected_tags = selected_data.get('selected_tags', [])
                      
                      # スコア付きタグの場合とシンプルなタグの場合を両方サポート
                      if selected_tags and isinstance(selected_tags[0], dict):
                          # スコア付きタグの場合はそのまま
                          pass
                      else:
                          # シンプルなタグの場合はスコア80をデフォルトで追加
                          selected_tags = [{"name": str(tag), "score": 80} for tag in selected_tags if tag]
                      
                      # スコアの高い順にソートして上位10個を取得
                      if selected_tags and isinstance(selected_tags[0], dict):
                          selected_tags = sorted(selected_tags, key=lambda x: x.get('score', 0), reverse=True)[:10]
                          
                  except Exception as e:
                      print(f"JSON parsing error: {e}")
                      print(f"Raw result: {result_text}")
                      # フォールバック: 最初の10個のタグを使用
                      selected_tags = [{"name": tag['name'], "score": 70} for tag in filtered_tags[:10]]
                  
                  return {
                      'selected_tags': selected_tags,
                      'cache_info': cache_info
                  }
              except Exception as e:
                  raise Exception(f"Recommendation failed: {str(e)}")

  # HTML Formatter Function (独立)
  HtmlFormatterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tag-selector-html-formatter-${AWS::StackName}'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt HtmlFormatterLambdaExecutionRole.Arn
      Timeout: 180
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref TagSelectorStateMachine
          MODEL_ID: !Ref ModelId
          INPUT_PRICE_PER_MILLION: !Ref InputTokenPrice
          OUTPUT_PRICE_PER_MILLION: !Ref OutputTokenPrice
          USD_TO_JPY: !Ref UsdToJpy
      Code:
        ZipFile: |
          const { SFNClient, StartSyncExecutionCommand } = require('@aws-sdk/client-sfn');
          const sfn = new SFNClient({ region: '${AWS::Region}' });
          
          exports.handler = async (event) => {
            try {
              const params = extractSlug(event);
              if (!params) {
                return createResponse(400, generateFormHTML('Contentful URL is required'));
              }
              
              const result = await executeStepFunctions(params);
              const data = JSON.parse(result.output);
              
              // 動的コスト計算
              calculateCosts(data);
              
              return createResponse(200, generateResultHTML(data));
            } catch (error) {
              console.error('Handler error:', error);
              return createResponse(500, generateErrorHTML(error.message));
            }
          };
          
          function extractSlug(event) {
            // 直接呼び出し
            if (event.entry_id) return { entry_id: event.entry_id, use_preview: true };
            
            // HTTP GET
            if (event.queryStringParameters?.contentful_url) {
              const entryId = extractEntryIdFromUrl(event.queryStringParameters.contentful_url);
              return entryId ? { entry_id: entryId, use_preview: true } : null;
            }
            
            // HTTP POST
            if (event.requestContext?.http?.method === 'POST' && event.body) {
              try {
                const bodyText = event.isBase64Encoded ? 
                  Buffer.from(event.body, 'base64').toString('utf-8') : event.body;
                
                if (event.headers['content-type'] === 'application/x-www-form-urlencoded') {
                  const params = new URLSearchParams(bodyText);
                  const contentfulUrl = params.get('contentful_url');
                  
                  if (contentfulUrl) {
                    const entryId = extractEntryIdFromUrl(contentfulUrl);
                    return entryId ? { entry_id: entryId, use_preview: true } : null;
                  }
                } else {
                  const body = JSON.parse(bodyText);
                  if (body.contentful_url) {
                    const entryId = extractEntryIdFromUrl(body.contentful_url);
                    return entryId ? { entry_id: entryId, use_preview: true } : null;
                  }
                }
              } catch (e) {
                return null;
              }
            }
            return null;
          }
          
          function extractEntryIdFromUrl(url) {
            // Check if URL starts with correct Contentful space
            if (!url.startsWith('https://app.contentful.com/spaces/ct0aopd36mqt/')) {
              return null;
            }
            const match = url.match(/\/entries\/([a-zA-Z0-9]+)(?:\?|$)/);
            return match ? match[1] : null;
          }
          
          async function executeStepFunctions(params) {
            const command = new StartSyncExecutionCommand({
              stateMachineArn: process.env.STATE_MACHINE_ARN,
              input: JSON.stringify({ 
                ...params,
                model_id: process.env.MODEL_ID || 'global.anthropic.claude-haiku-4-5-20251001-v1:0'
              })
            });
            
            const result = await sfn.send(command);
            if (result.status !== 'SUCCEEDED') {
              throw new Error(result.error || 'Step Functions execution failed');
            }
            return result;
          }
          
          function calculateCosts(data) {
            const inputPrice = parseFloat(process.env.INPUT_PRICE_PER_MILLION) || 0.25;
            const outputPrice = parseFloat(process.env.OUTPUT_PRICE_PER_MILLION) || 1.25;
            const usdToJpy = parseFloat(process.env.USD_TO_JPY) || 150;
            
            if (data.cost_breakdown?.total) {
              const { input_tokens = 0, output_tokens = 0 } = data.cost_breakdown.total;
              const inputCostUsd = (input_tokens / 1000000) * inputPrice;
              const outputCostUsd = (output_tokens / 1000000) * outputPrice;
              const totalCostJpy = (inputCostUsd + outputCostUsd) * usdToJpy;
              
              Object.assign(data.cost_breakdown.total, {
                total_cost_jpy: Math.round(totalCostJpy * 100) / 100,
                input_cost_jpy: Math.round(inputCostUsd * usdToJpy * 100) / 100,
                output_cost_jpy: Math.round(outputCostUsd * usdToJpy * 100) / 100
              });
            }
          }
          
          function createResponse(statusCode, body) {
            return {
              statusCode,
              headers: { 'Content-Type': 'text/html; charset=utf-8' },
              body
            };
          }
          
          function generateFormHTML(error = '') {
