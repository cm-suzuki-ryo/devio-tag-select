AWSTemplateFormatVersion: '2010-09-09'
Description: 'Improved Tag Selector with separated Lambda functions'

Parameters:
  ContentfulAccessToken:
    Type: String
    Default: '6Z4wPWStkHj3d_EA0MQt89nWJpIFSBJcmAQ_YzDpkAg'
  ContentfulSpaceId:
    Type: String
    Default: 'ct0aopd36mqt'
  ModelId:
    Type: String
    Default: 'global.anthropic.claude-haiku-4-5-20251001-v1:0'

Resources:
  # IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
        - PolicyName: LambdaInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'

  # Summary Lambda
  SummaryLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-summary-v2
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          
          def create_summary_with_claude(blog_text, model_id):
              bedrock = boto3.client('bedrock-runtime')
              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 8000,
                  "system": [{"type": "text", "text": "あなたは記事要約の専門家です。"}],
                  "messages": [{"role": "user", "content": f"以下のブログ記事を1000文字程度で要約してください：\n\n{blog_text}"}]
              }
              response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
              response_body = json.loads(response['body'].read())
              return response_body['content'][0]['text'], {
                  'input_tokens': response_body['usage']['input_tokens'],
                  'output_tokens': response_body['usage']['output_tokens']
              }
          
          def lambda_handler(event, context):
              try:
                  blog_text = event.get('blog_text')
                  model_id = event.get('model_id', os.environ.get('MODEL_ID'))
                  
                  summary_text, cache_info = create_summary_with_claude(blog_text, model_id)
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'summary_text': summary_text,
                          'cache_info': cache_info
                      }, ensure_ascii=False)
                  }
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}

  # Tag Recommendation Lambda
  TagRecommendationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-recommendation-v2
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import urllib3
          import hashlib
          import re
          
          def get_tags_from_contentful():
              http = urllib3.PoolManager()
              access_token = os.environ.get('CONTENTFUL_ACCESS_TOKEN')
              space_id = os.environ.get('CONTENTFUL_SPACE_ID')
              url = f"https://cdn.contentful.com/spaces/{space_id}/entries?content_type=blogTags&limit=1000&access_token={access_token}&locale=ja"
              
              response = http.request('GET', url)
              data = json.loads(response.data.decode('utf-8'))
              
              tags_data = []
              for item in data.get('items', []):
                  tags_field = item.get('fields', {}).get('tags', [])
                  for tag in tags_field:
                      tags_data.append({
                          'id': str(tag.get('id', '')),
                          'name': tag.get('name', '')
                      })
              
              return tags_data
          
          def select_tags_with_model(text, tags, model_id):
              bedrock = boto3.client('bedrock-runtime')
              tags_list = "\n".join([f"{tag['id']}: {tag['name']}" for tag in tags])
              
              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 4000,
                  "system": [{"type": "text", "text": "あなたは記事のタグ選択の専門家です。"}],
                  "messages": [{
                      "role": "user",
                      "content": f"以下の記事に最も適切なタグを5個選んでください。\n\n記事:\n{text}\n\nタグ一覧:\n{tags_list}\n\n選択したタグのIDのみを数字で、カンマ区切りで回答してください。"
                  }]
              }
              
              response = bedrock.invoke_model(modelId=model_id, body=json.dumps(body))
              response_body = json.loads(response['body'].read())
              result_text = response_body['content'][0]['text']
              
              selected_ids = re.findall(r'\d+', result_text)
              selected_tags = [tag for tag in tags if tag['id'] in selected_ids]
              
              return selected_tags, {
                  'input_tokens': response_body['usage']['input_tokens'],
                  'output_tokens': response_body['usage']['output_tokens'],
                  'ai_response': result_text,
                  'extracted_ids': selected_ids
              }
          
          def lambda_handler(event, context):
              try:
                  text = event.get('text')
                  model_id = event.get('model_id', os.environ.get('MODEL_ID'))
                  
                  all_tags = get_tags_from_contentful()
                  selected_tags, cache_info = select_tags_with_model(text, all_tags, model_id)
                  
                  # デバッグ情報追加
                  cache_info['tags_count'] = len(all_tags)
                  cache_info['text_length'] = len(text) if text else 0
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'selected_tags': selected_tags,
                          'cache_info': cache_info
                      }, ensure_ascii=False)
                  }
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}

  # Main Lambda
  MainLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-main-v2
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          SUMMARY_LAMBDA_NAME: !Ref SummaryLambdaFunction
          RECOMMENDATION_LAMBDA_NAME: !Ref TagRecommendationLambdaFunction
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          
          def lambda_handler(event, context):
              try:
                  # パラメータ取得 - GET/POST両対応
                  params = {}
                  
                  # Query string parameters (GET)
                  if event.get('queryStringParameters'):
                      params.update(event['queryStringParameters'])
                  
                  # Body parameters (POST)
                  if event.get('body'):
                      try:
                          if isinstance(event['body'], str):
                              body_params = json.loads(event['body'])
                          else:
                              body_params = event['body']
                          params.update(body_params)
                      except:
                          pass
                  
                  # Direct invocation
                  if not params:
                      params = event
                  
                  blog_text = params.get('blog_text', '')
                  model_id = params.get('model_id', os.environ.get('MODEL_ID'))
                  
                  lambda_client = boto3.client('lambda')
                  
                  # 長文記事の場合は要約
                  processing_text = blog_text
                  if len(blog_text) > 10000:
                      summary_response = lambda_client.invoke(
                          FunctionName=os.environ.get('SUMMARY_LAMBDA_NAME'),
                          Payload=json.dumps({'blog_text': blog_text, 'model_id': model_id})
                      )
                      summary_result = json.loads(json.loads(summary_response['Payload'].read())['body'])
                      processing_text = summary_result['summary_text']
                  
                  # 推奨タグ取得
                  recommendation_response = lambda_client.invoke(
                      FunctionName=os.environ.get('RECOMMENDATION_LAMBDA_NAME'),
                      Payload=json.dumps({'text': processing_text, 'model_id': model_id})
                  )
                  recommendation_result = json.loads(json.loads(recommendation_response['Payload'].read())['body'])
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'selected_tags': recommendation_result['selected_tags'],
                          'cache_info': recommendation_result['cache_info'],
                          'model_id': model_id
                      }, ensure_ascii=False)
                  }
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}

  # Function URLs
  MainLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt MainLambdaFunction.Arn
      AuthType: NONE

  MainLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MainLambdaFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  MainLambdaUrl:
    Description: "Main Lambda Function URL"
    Value: !GetAtt MainLambdaUrl.FunctionUrl
  Architecture:
    Description: "Improved 3-Lambda Architecture"
    Value: "Main (orchestration) → Summary + Recommendation (specialized)"
