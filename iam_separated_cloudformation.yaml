AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Lambda Separated Architecture - IAM-based execution (no Function URLs)'

Parameters:
  ContentfulAccessToken:
    Type: String
    Description: 'Contentful API Access Token'
    Default: '6Z4wPWStkHj3d_EA0MQt89nWJpIFSBJcmAQ_YzDpkAg'
    NoEcho: true
  
  ContentfulSpaceId:
    Type: String
    Description: 'Contentful Space ID'
    Default: 'ct0aopd36mqt'
  
  ModelId:
    Type: String
    Description: 'Bedrock Model ID'
    Default: 'global.anthropic.claude-haiku-4-5-20251001-v1:0'

Resources:
# --------------------------------------------- #
# IAM Role for Lambda Functions
# --------------------------------------------- #
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
        - PolicyName: LambdaInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'

# --------------------------------------------- #
# IAM Role for CLI/SDK Access
# --------------------------------------------- #
  LambdaInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TagSelectorLambdaInvokeRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TagsLambdaFunction.Arn
                  - !GetAtt SummaryLambdaFunction.Arn
                  - !GetAtt TagSelectorFunction.Arn

# --------------------------------------------- #
# Tags Lambda Function
# --------------------------------------------- #
  TagsLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-tags-iam
      Runtime: python3.11
      Handler: tags_lambda.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
      Code:
        ZipFile: |
          import json
          import os
          import time
          import urllib3
          import hashlib

          def get_tags_from_contentful():
              access_token = os.environ.get('CONTENTFUL_ACCESS_TOKEN')
              if not access_token:
                  raise ValueError("CONTENTFUL_ACCESS_TOKEN environment variable is required")
              
              space_id = os.environ.get('CONTENTFUL_SPACE_ID', 'ct0aopd36mqt')
              http = urllib3.PoolManager()
              
              url = f"https://cdn.contentful.com/spaces/{space_id}/entries?limit=1&select=fields.tags&access_token={access_token}&content_type=blogTags"
              
              response = http.request('GET', url)
              if response.status != 200:
                  raise Exception(f"Contentful API error: {response.status}")
              
              data = json.loads(response.data.decode('utf-8'))
              
              tags_data = []
              if data.get('items') and len(data['items']) > 0:
                  fields = data['items'][0].get('fields', {})
                  tags_list = fields.get('tags', [])
                  
                  for i, tag_obj in enumerate(tags_list):
                      if tag_obj and isinstance(tag_obj, dict):
                          tag_name = tag_obj.get('name', '')
                          if tag_name:
                              tags_data.append({
                                  'id': str(i + 1),
                                  'name': tag_name
                              })
              
              content_str = json.dumps(tags_data, sort_keys=True, ensure_ascii=False)
              content_hash = hashlib.md5(content_str.encode('utf-8')).hexdigest()
              
              return tags_data, content_hash

          def lambda_handler(event, context):
              try:
                  tags_data, tags_hash = get_tags_from_contentful()
                  
                  return {
                      'tags_data': tags_data,
                      'tags_hash': tags_hash,
                      'tags_count': len(tags_data),
                      'timestamp': time.time()
                  }
                  
              except Exception as e:
                  raise Exception(f"Tags Lambda error: {str(e)}")

# --------------------------------------------- #
# Summary Lambda Function
# --------------------------------------------- #
  SummaryLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-summary-iam
      Runtime: python3.11
      Handler: summary_lambda.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import os
          import urllib3
          import boto3
          
          def get_article_from_contentful(slug):
              http = urllib3.PoolManager()
              access_token = os.environ.get('CONTENTFUL_ACCESS_TOKEN')
              space_id = os.environ.get('CONTENTFUL_SPACE_ID', 'ct0aopd36mqt')
              url = f"https://cdn.contentful.com/spaces/{space_id}/entries?limit=1&fields.slug={slug}&locale=ja&access_token={access_token}&content_type=blogPost&select=fields.content,fields.title"
              
              response = http.request('GET', url)
              if response.status != 200:
                  raise Exception(f"Contentful API error: {response.status}")
              
              data = json.loads(response.data.decode('utf-8'))
              
              if data.get('items') and len(data['items']) > 0:
                  fields = data['items'][0].get('fields', {})
                  title = fields.get('title', '')
                  content = fields.get('content', '')
                  return f"{title}\n\n{content}"
              
              return None

          def create_summary_with_claude(blog_text, model_id):
              bedrock = boto3.client('bedrock-runtime')
              
              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 8000,
                  "system": [{"type": "text", "text": "あなたは記事要約の専門家です。"}],
                  "messages": [{
                      "role": "user",
                      "content": f"以下のブログ記事を1000文字程度で要約してください。技術的なキーワードや重要な概念は必ず含めてください：\n\n{blog_text}"
                  }]
              }
              
              response = bedrock.invoke_model(
                  modelId=model_id,
                  body=json.dumps(body)
              )
              
              response_body = json.loads(response['body'].read())
              summary_text = response_body['content'][0]['text']
              
              cache_info = {
                  'input_tokens': response_body['usage']['input_tokens'],
                  'output_tokens': response_body['usage']['output_tokens']
              }
              
              return summary_text, cache_info

          def lambda_handler(event, context):
              try:
                  article_id = event.get('article_id')
                  model_id = event.get('model_id', os.environ.get('MODEL_ID'))
                  blog_text = event.get('blog_text')
                  
                  if not blog_text and article_id:
                      blog_text = get_article_from_contentful(article_id)
                  elif not blog_text:
                      raise ValueError("article_id or blog_text is required")
                  
                  summary_text, cache_info = create_summary_with_claude(blog_text, model_id)
                  
                  return {
                      'summary_text': summary_text,
                      'cache_info': cache_info,
                      'model_id': model_id
                  }
                  
              except Exception as e:
                  raise Exception(f"Summary Lambda error: {str(e)}")

# --------------------------------------------- #
# Tag Selector Lambda Function
# --------------------------------------------- #
  TagSelectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tag-selector-main-iam
      Runtime: python3.11
      Handler: tag_selector_lambda.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          CONTENTFUL_ACCESS_TOKEN: !Ref ContentfulAccessToken
          CONTENTFUL_SPACE_ID: !Ref ContentfulSpaceId
          MODEL_ID: !Ref ModelId
          INPUT_PRICE_PER_MILLION: '0.25'
          OUTPUT_PRICE_PER_MILLION: '1.25'
          USD_TO_JPY: '150'
          SUMMARY_LAMBDA_NAME: !Ref SummaryLambdaFunction
          TAGS_LAMBDA_NAME: !Ref TagsLambdaFunction
      Code:
        ZipFile: |
          # Placeholder - deploy actual code separately
          import json
          def lambda_handler(event, context):
              return {'message': 'Tag Selector Lambda - Deploy actual code'}

Outputs:
  TagsLambdaArn:
    Description: 'Tags Lambda Function ARN'
    Value: !GetAtt TagsLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TagsLambdaArn'

  SummaryLambdaArn:
    Description: 'Summary Lambda Function ARN'
    Value: !GetAtt SummaryLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SummaryLambdaArn'

  TagSelectorArn:
    Description: 'Tag Selector Lambda Function ARN'
    Value: !GetAtt TagSelectorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TagSelectorArn'

  InvokeRoleArn:
    Description: 'IAM Role ARN for Lambda invocation'
    Value: !GetAtt LambdaInvokeRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-InvokeRoleArn'

  CLICommands:
    Description: 'AWS CLI commands for Lambda invocation'
    Value: !Sub |
      # Tags Lambda
      aws lambda invoke --function-name ${TagsLambdaFunction} --payload '{}' response.json
      
      # Summary Lambda  
      aws lambda invoke --function-name ${SummaryLambdaFunction} --payload '{"article_id":"test-article"}' response.json
      
      # Tag Selector Lambda
      aws lambda invoke --function-name ${TagSelectorFunction} --payload '{"article_id":"test-article"}' response.json
    Export:
      Name: !Sub '${AWS::StackName}-CLICommands'
