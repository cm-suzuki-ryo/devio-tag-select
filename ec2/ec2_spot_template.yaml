AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Spot Instance with Amazon Linux 2023 and SSH Security Group'

Parameters:
  Ec2ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64
    Description: 'AMI ID for EC2 instance'
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: 'vpc-10544f72'
    Description: 'VPC ID for Security Group'
  
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: 'subnet-a3cbbb8b'
    Description: 'Subnet ID for Spot Instance'
  
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: 'm4mini'
    Description: 'EC2 Key Pair for SSH access'
  
  InstanceType:
    Type: String
    Default: 'r6gd.medium'
    AllowedValues:
      - t4g.nano
      - t4g.micro
      - t4g.small
      - t4g.medium
      - t4g.large
      - r6gd.medium
      - r6gd.large
      - r6gd.xlarge
      - c6gd.medium
      - c6gd.large
      - m6gd.medium
      - m6gd.large
    Description: 'EC2 Instance Type (ARM64 instances with instance store)'
  
  VolumeSize:
    Type: Number
    Default: 8
    MinValue: 8
    MaxValue: 100
    Description: 'EBS Root Volume Size (GB)'
  
  AllowedCidr:
    Type: String
    Default: '133.201.48.65/32'
    Description: 'CIDR block for SSH access (e.g., 1.2.3.4/32 for single IP)'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: 'Must be a valid CIDR notation (e.g., 192.168.1.1/32)'
  
  OnDemandPercentage:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: 'Percentage of On-Demand instances (0-100, 0=All Spot)'
  
  MinSize:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: 'Minimum number of instances'
  
  MaxSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: 'Maximum number of instances'
  
  DesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: 'Desired number of instances'

Resources:
# --------------------------------------------- #
# Security Group For SSH
# --------------------------------------------- #
  SecurityGroupSSH:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'SSH access from specific IP'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: 'SSH access from specified CIDR'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'All outbound traffic'

# --------------------------------------------- #
# IAM For JOB (ec2)
# --------------------------------------------- #
  Ec2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      Policies: !Ref 'AWS::NoValue'
      RoleName: !Ref 'AWS::NoValue'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AdministratorAccess

  Ec2IAMProfile:
    Type: AWS::IAM::InstanceProfile
    DependsOn: Ec2IAMRole
    Properties:
      Path: /
      Roles:
      - !Ref 'Ec2IAMRole'

# --------------------------------------------- #
# LaunchTemplate For Spot Instance
# --------------------------------------------- #
  Ec2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        SecurityGroupIds:
        - !Ref SecurityGroupSSH
        InstanceInitiatedShutdownBehavior: terminate
        IamInstanceProfile:
          Arn: !GetAtt 'Ec2IAMProfile.Arn'
        ImageId: !Ref 'Ec2ImageId'
        KeyName: !Ref KeyName
        Monitoring:
          Enabled: false
        InstanceType: !Ref InstanceType
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: false

        UserData: !Base64
          Fn::Sub: |
            #cloud-config
            repo_update: true
            repo_upgrade: all
            packages:
              - jq
              - docker
              - git
              - unzip
            runcmd:
              - yum clean all
              - free
              # nvme1n1 (instance store ssd) setup
              - mkfs.ext4 /dev/nvme1n1
              - mkdir -p /mnt/nvme1n1
              - mount /dev/nvme1n1 /mnt/nvme1n1
              - chmod 755 /mnt/nvme1n1
              # Create directories on instance store
              - mkdir -p /mnt/nvme1n1/docker
              - mkdir -p /mnt/nvme1n1/tmp
              - mkdir -p /mnt/nvme1n1/workspace
              - chown -R ec2-user:ec2-user /mnt/nvme1n1/workspace
              # Docker data directory setup
              - systemctl stop docker || true
              - mkdir -p /etc/docker
              - echo '{"data-root":"/mnt/nvme1n1/docker"}' > /etc/docker/daemon.json
              # Docker setup
              - systemctl start docker
              - systemctl enable docker
              - usermod -a -G docker ec2-user
              # Symbolic links for ec2-user
              - sudo -u ec2-user ln -sf /mnt/nvme1n1/workspace /home/ec2-user/workspace
              - sudo -u ec2-user ln -sf /mnt/nvme1n1/tmp /home/ec2-user/tmp
              # Swap file on instance store
              - /usr/bin/dd if=/dev/zero of=/mnt/nvme1n1/swapfile bs=100M count=10
              - chmod 600 /mnt/nvme1n1/swapfile
              - /usr/sbin/mkswap /mnt/nvme1n1/swapfile
              - /usr/sbin/swapon /mnt/nvme1n1/swapfile
              - free
              # Q CLI installation for ec2-user
              - sudo -u ec2-user bash -c 'cd /home/ec2-user && curl --proto "=https" --tlsv1.2 -sSf "https://desktop-release.q.us-east-1.amazonaws.com/latest/q-aarch64-linux.zip" -o "q.zip"'
              - sudo -u ec2-user bash -c 'cd /home/ec2-user && unzip q.zip'
              - sudo -u ec2-user bash -c 'cd /home/ec2-user && ./q/install.sh'
              # SSH key setup for git
              - sudo -u ec2-user mkdir -p /home/ec2-user/.ssh
              - sudo -u ec2-user chmod 700 /home/ec2-user/.ssh
              - aws secretsmanager get-secret-value --secret-id "arn:aws:secretsmanager:ap-northeast-1:784693731708:secret:git-cm-suzuki-ryo-XBTk0O" --region ap-northeast-1 | jq -r .SecretBinary | base64 --decode > /home/ec2-user/.ssh/id_rsa_git
              - chown ec2-user:ec2-user /home/ec2-user/.ssh/id_rsa_git
              - chmod 600 /home/ec2-user/.ssh/id_rsa_git
              - sudo -u ec2-user ssh-keyscan -H github.com >> /home/ec2-user/.ssh/known_hosts
              - echo -e "Host github.com\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null" > /home/ec2-user/.ssh/config
              - chown ec2-user:ec2-user /home/ec2-user/.ssh/config
              - chmod 600 /home/ec2-user/.ssh/config
              # Git configuration
              - sudo -u ec2-user git config --global user.name "suzuki.ryo"
              - sudo -u ec2-user git config --global user.email "suzuki.ryo@classmethod.jp"
              # Clone devio-tag-select repository
              - sudo -u ec2-user bash -c 'cd /home/ec2-user/workspace && git clone git@github.com:cm-suzuki-ryo/devio-tag-select.git'

# --------------------------------------------- #
# Auto Scaling Group with Spot Instances
# --------------------------------------------- #
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref Ec2LaunchTemplate
            Version: !GetAtt Ec2LaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref InstanceType
        InstancesDistribution:
          OnDemandPercentage: !Ref OnDemandPercentage
          SpotAllocationStrategy: lowest-price
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier:
        - !Ref SubnetId
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300

Outputs:
  SecurityGroupId:
    Description: 'Security Group ID for SSH access'
    Value: !Ref SecurityGroupSSH
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupSSH'
  
  LaunchTemplateId:
    Description: 'Launch Template ID'
    Value: !Ref Ec2LaunchTemplate
    Export:
      Name: !Sub '${AWS::StackName}-LaunchTemplate'
  
  AutoScalingGroupName:
    Description: 'Auto Scaling Group Name'
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub '${AWS::StackName}-AutoScalingGroup'
